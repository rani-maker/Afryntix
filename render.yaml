# ============================================================
# AFRYNTIX — Render deployment config
# Avant de committer : remplace YOUR_DOCKERHUB_USERNAME
# ============================================================

services:
  - type: web
    name: afryntix
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: pro
    region: frankfurt
    healthCheckPath: /api/health

    envVars:
      # --- Database Supabase ---
      - key: DATABASE_URL
        sync: false                        # à saisir dans le dashboard Render

      - key: DIRECT_URL
        sync: false

      # --- Auth ---
      - key: AUTH_SECRET
        sync: false                        # openssl rand -base64 32

      - key: AUTH_URL
        value: https://www.afryntix.com

      # --- Twilio WhatsApp Business API ---
      - key: TWILIO_ACCOUNT_SID
        sync: false                        # ex: AC...

      - key: TWILIO_AUTH_TOKEN
        sync: false                        # console Twilio → API keys & tokens

      - key: TWILIO_WHATSAPP_FROM
        sync: false                        # ex: whatsapp:+2250502466412

      # Templates WhatsApp approuvés par Meta (ContentSid Twilio HX...).
      # SID vide → fallback automatique freeform (OK fenêtre 24h).
      - key: TWILIO_TEMPLATE_RECEPTION_NOTICE_SID
        sync: false

      - key: TWILIO_TEMPLATE_SHIPMENT_AVAILABLE_SID
        sync: false

      - key: TWILIO_TEMPLATE_SHIPMENTS_AVAILABLE_MULTI_SID
        sync: false

      - key: TWILIO_TEMPLATE_PICKUP_CODE_SID
        sync: false

      - key: TWILIO_TEMPLATE_RESERVATION_VALIDATED_SID
        sync: false

      # --- App publique ---
      - key: NEXT_PUBLIC_APP_NAME
        value: AFRYNTIX

      - key: NEXT_PUBLIC_COMPANY_TAGLINE
        value: "Transport & Logistique Chine - Afrique de l'Ouest"

      - key: NEXT_PUBLIC_APP_URL
        value: https://www.afryntix.com

      # APP_URL — utilisé côté serveur pour les liens WhatsApp (runtime, non exposé au client)
      - key: APP_URL
        value: https://www.afryntix.com   # à adapter si domaine custom

      # --- Admin seed ---
      - key: DEFAULT_ADMIN_EMAIL
        sync: false

      - key: DEFAULT_ADMIN_PASSWORD
        sync: false

      - key: DEFAULT_ADMIN_NAME
        sync: false

      - key: DEFAULT_ADMIN_PHONE
        sync: false

      # --- Emails : SMTP de la boîte Namecheap Private Email ---
      # (les ports SMTP ne sont ouverts que sur les offres payantes de Render)
      - key: SMTP_HOST
        value: mail.privateemail.com

      - key: SMTP_PORT
        value: "465"

      - key: SMTP_USER
        value: infos@afryntix.com

      - key: SMTP_PASSWORD
        sync: false

      - key: EMAIL_FROM
        value: "AFRYNTIX <infos@afryntix.com>"

      # Boîte qui reçoit les bons de commande catalogue et la copie des devis
      - key: ORDERS_NOTIFY_EMAIL
        value: infos@afryntix.com

      # Alternative sans SMTP (API Resend) — laisser vide si SMTP est utilisé
      - key: RESEND_API_KEY
        sync: false

      # --- Runtime ---
      - key: NODE_ENV
        value: production
